name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
      - name: CLI smoke
        run: agent-file-integrity-litmus fixtures

  public-install:
    name: Immutable public release install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install public release commit
        run: python -m pip install "git+https://github.com/itscloud0/agent-file-integrity-litmus.git@383d3d85f8353627044b8a9c0452094ad77700a4"
      - name: List public release fixtures
        run: agent-file-integrity-litmus fixtures
